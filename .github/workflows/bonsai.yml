name: bonsai

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/bonsai.yml]

permissions:
  contents: write

concurrency: bonsai

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@bec04c39f62731fdb28c3b82322ef21cbf3bdfac
        with:
          commit: "false"
          github-token: ${{ secrets.PROFILE_PAT }}
      - name: Commit the bonsai if it changed
        shell: bash
        run: |
          git add output
          if git diff --cached --quiet; then
            echo "Bonsai unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: tend the bonsai"
          git pull --rebase --quiet
          git push --quiet
